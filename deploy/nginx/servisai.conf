# servisai.uz — nginx sozlamasi
#
# Docker konteynerlari faqat 127.0.0.1 da ochiq (docker-compose.yml, BIND_HOST), tashqariga nginx chiqaradi.
# Portlar .env dagi FRONTEND_PORT / BACKEND_PORT bilan bir xil bo‘lishi kerak.
#
# HTTPS (443) va http -> https yo‘naltirishni certbot o‘zi qo‘shadi:
#   sudo certbot --nginx -d servisai.uz -d api.servisai.uz --redirect

upstream servisai_frontend {
    server 127.0.0.1:3101;
    keepalive 16;
}

upstream servisai_backend {
    server 127.0.0.1:8101;
    keepalive 16;
}

# ---------- servisai.uz — sayt ----------
server {
    listen 80;
    listen [::]:80;
    server_name servisai.uz;

    # Hisob to‘ldirish cheki 10 MB gacha
    client_max_body_size 12m;

    # API so‘rovlari Next.js’ni chetlab to‘g‘ridan-to‘g‘ri backendga (tezroq, katta fayllar uchun cheklov yo‘q)
    location /api/ {
        proxy_pass http://servisai_backend;
        include /etc/nginx/snippets/servisai-proxy.conf;
    }

    location / {
        proxy_pass http://servisai_frontend;
        include /etc/nginx/snippets/servisai-proxy.conf;
    }
}

# ---------- api.servisai.uz — backend (API, /api/docs) ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.servisai.uz;

    client_max_body_size 12m;

    location / {
        proxy_pass http://servisai_backend;
        include /etc/nginx/snippets/servisai-proxy.conf;
    }
}
